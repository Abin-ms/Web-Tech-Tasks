<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FoodHub - Fresh Food Delivery</title>

    <link rel="stylesheet" href="./stt.css" />
  </head>

  <body>
    <section class="outer">
      <nav>
        <h1 class="logo">FOOD HUB</h1>

        <div class="inner-container">
          <a href="#">HOME</a>
          <a href="#">ABOUT</a>
          <a href="#">GALLERY</a>
          <a href="#">CONTACT</a>
        </div>
      </nav>

      <div class="hero-content">
        <h1>Fresh Food Delivered To Your Door</h1>

        <p>Order delicious meals from your favourite restaurants.</p>

        <button>Order Now</button>
      </div>
    </section>

    <section class="food-section">
      <h2>Popular Foods</h2>

      <p class="section-description">
        Choose your favourite meal and order now.
      </p>

      <div class="food-container">
        <div class="food-card">
          <img src="../task-08-10/images/burger.png" alt="Burger" />

          <div class="food-info">
            <h3>Burger</h3>

            <p class="price">$8.99</p>

            <button>Buy Now</button>
          </div>
        </div>

        <div class="food-card">
          <img src="../task-08-10/images/pizza.jpg" alt="Pizza" />

          <div class="food-info">
            <h3>Pizza</h3>

            <p class="price">$10.99</p>

            <button>Buy Now</button>
          </div>
        </div>

        <div class="food-card">
          <img src="../task-08-10/images/pasta.png" alt="Pasta" />

          <div class="food-info">
            <h3>Pasta</h3>

            <p class="price">$9.99</p>

            <button>Buy Now</button>
          </div>
        </div>

        <div class="food-card">
          <img src="../task-08-10/images/sandwich.jpg" alt="Sandwich" />

          <div class="food-info">
            <h3>Sandwich</h3>

            <p class="price">$7.99</p>

            <button>Buy Now</button>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 FoodHub</p>
    </footer>
  </body>
</html>
